name: test

on:
  push:
  pull_request:

jobs:
  sim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: dist/ è aggiornato
        run: git diff --exit-code dist/ || (echo "Lancia npm run build e committa dist/." && exit 1)
